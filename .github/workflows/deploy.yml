name: Deploy
# Manual deployment of the demo to Cloudflare Workers (Actions -> Deploy -> Run workflow).
# Requires the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi
      - name: Verify Cloudflare credentials
        run: |
          TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          ACCT=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          echo "API token: raw length ${#CLOUDFLARE_API_TOKEN}, trimmed length ${#TOKEN}, lines $(printf %s "$CLOUDFLARE_API_TOKEN" | grep -c '')"
          echo "Account ID: raw length ${#CLOUDFLARE_ACCOUNT_ID}, trimmed length ${#ACCT} (expected 32)"
          # Hints about common mistakes (lengths only, values are never printed)
          if [ "${#TOKEN}" -ne 40 ] && [ "${#TOKEN}" -ne 53 ]; then echo "HINT: Cloudflare API tokens are usually 40 characters (older format) or 53 (cfut_ or cfat_ prefix); this one has ${#TOKEN}."; fi
          if printf %s "$TOKEN" | grep -qE '^cf(ut|at)_'; then echo "Token prefix: looks like a current-format Cloudflare token (cfut_ or cfat_)."; else echo "Token prefix: does not start with cfut_ or cfat_ (fine for older tokens)."; fi
          BAD=$(printf %s "$TOKEN" | LC_ALL=C grep -o '[^A-Za-z0-9_-]' | wc -l)
          echo "Characters outside A-Z a-z 0-9 _ - in the token: $BAD"
          if [ "$BAD" -gt 0 ]; then echo "HINT: the token contains unexpected characters (hex bytes: $(printf %s "$TOKEN" | LC_ALL=C grep -o '[^A-Za-z0-9_-]' | od -An -tx1 | tr -d '\n'))."; fi
          if [ "${#ACCT}" -ne 32 ]; then echo "HINT: a Cloudflare account ID is 32 characters; this one has ${#ACCT}."; fi
          if printf %s "$TOKEN" | grep -qiE '^bearer'; then echo "HINT: the token secret starts with 'Bearer'. Store only the token."; fi
          if printf %s "$TOKEN" | grep -q '='; then echo "HINT: the token secret contains '='. Store only the token, not NAME=value."; fi
          if printf %s "$TOKEN" | grep -qE '^[0-9a-f]{32}$'; then echo "HINT: the token secret looks like an account ID (32 hex characters). The two secrets may be swapped."; fi
          if printf %s "$ACCT" | grep -qE '^[A-Za-z0-9_-]{40}$'; then echo "HINT: the account ID secret looks like an API token. The two secrets may be swapped."; fi
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCT"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCT" >> "$GITHUB_ENV"
          case "$TOKEN" in cfut_*) echo "Token type: user token (cfut_)";; cfat_*) echo "Token type: account-owned token (cfat_)";; *) echo "Token type: unknown prefix";; esac
          STATUS=$(curl -s -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)
          echo "User-token verification: HTTP $STATUS"
          python3 -c "import json;d=json.load(open('/tmp/verify.json'));print('success:', d.get('success'), '| errors:', [e.get('message') for e in d.get('errors', [])])" 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            STATUS2=$(curl -s -o /tmp/verify2.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCT/tokens/verify" || true)
            echo "Account-token verification: HTTP $STATUS2"
            python3 -c "import json;d=json.load(open('/tmp/verify2.json'));print('success:', d.get('success'), '| errors:', [e.get('message') for e in d.get('errors', [])])" 2>/dev/null || true
            if [ "$STATUS2" != "200" ]; then
              echo "The Cloudflare API token was rejected by both verification endpoints. Check that it is active, not expired, belongs to this account and has Workers, D1 and DNS permissions." >&2
              exit 1
            fi
          fi
      - run: npm run deploy
